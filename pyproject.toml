[project]
name = "ai-data-analysis-agent"
version = "0.1.0"
description = "Agente de análise de dados com IA — fundação do projeto (Fase 1, conforme SDD v2.0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Guilherme" }]

dependencies = [
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
    "performance: testes de performance/escala (tests/performance/) — mais lentos, rodam separadamente via `pytest -m performance`.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_agent"]